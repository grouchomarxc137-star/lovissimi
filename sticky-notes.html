<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stick Notes | To the Principessa that stole my heart. I adore you💛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar"><h1>To my woman, I'm your daddy😂💛</h1></header>
  <main>
    <section class="card hero">
      <p class="eyebrow">Chapter: Sticky Notes</p>
      <h2>Our Stick Notes</h2>
      <p class="subtitle">Tiny notes for each other, always visible.</p>
      <p><a class="back-link" href="index.html">← Back to Home</a></p>
    </section>

    <section class="card">
      <form id="stick-form" class="love-board-form">
        <input id="stick-author" type="text" placeholder="From (e.g. Me / You)" maxlength="30" required />
        <textarea id="stick-message" rows="3" placeholder="Write a sweet sticky note..." maxlength="240" required></textarea>
        <button type="submit">Pin Sticky Note</button>
      </form>
      <p id="stick-empty" class="muted">No sticky notes yet. Leave the first one 💛</p>
      <div id="stick-board" class="stick-board">
        <div id="stick-list" class="stick-layer"></div>
      </div>
    </section>
  </main>
  <footer>
    <p>Built with love, care, and attention</p>
  </footer>
  <script src="data.js?v=20260525b"></script>
  <script src="script.js?v=20260525b"></script>
</body>
</html>
