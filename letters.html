<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letters | To the Principessa that stole my heart. I adore you💛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar"><h1>To my everything, NHEBEK💛</h1></header>
  <main>
    <section class="card hero">
      <p class="eyebrow">Chapter: Letters</p>
      <h2>Sealed Love Letters</h2>
      <p class="subtitle">Write a letter, seal it, and open each envelope to read.</p>
      <p><a class="back-link" href="index.html">← Back to Home</a></p>
    </section>

    <section class="card">
      <form id="letters-form" class="love-board-form">
        <input id="letters-author" type="text" placeholder="From (e.g. Me / You)" maxlength="30" required />
        <textarea id="letters-message" rows="5" placeholder="Write your letter..." maxlength="1200" required></textarea>
        <button type="submit">Seal Letter</button>
      </form>
      <p id="letters-empty" class="muted">No letters yet. Leave the first one 💛</p>
      <div id="letters-list" class="letters-list"></div>
    </section>
  </main>
  <footer>
    <p>Built with love, care, and attention</p>
  </footer>
  <script src="data.js?v=20260522f"></script>
  <script src="script.js?v=20260522f"></script>
</body>
</html>
